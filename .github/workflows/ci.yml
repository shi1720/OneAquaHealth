name: Quality checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rill_ci
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: rill_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rill_ci -d rill_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify PostgreSQL API, recovery, and transaction invariants
        env:
          RILL_TEST_STORAGE: postgres
          RILL_TEST_POSTGRES_URL: postgresql://rill_ci:isolated_ci_password@127.0.0.1:5432/rill_ci
        run: npx vitest run tests/backend.test.ts tests/recovery.test.ts tests/postgres.test.ts tests/rate-config.test.ts
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: RILL_TEST_STORAGE=libsql npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build and smoke-test the container
        run: |
          docker build -t rill:test .
          docker run -d --rm --name rill-ci -p 8791:8787 -v rill-ci-data:/app/data -e APP_ORIGIN=http://localhost:8791 -e NODE_ENV=development rill:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8791/api/health > /dev/null; then break; fi
            sleep 1
          done
          RILL_SMOKE_ORIGIN=http://localhost:8791 npx tsx server/smoke.ts
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs rill-ci || true
          docker stop rill-ci || true
          docker volume rm rill-ci-data || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
          retention-days: 7
